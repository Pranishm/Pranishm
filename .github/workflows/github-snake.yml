name: Generate GitHub Snake

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#2a153d,#47206a,#7c3aed,#c026d3,#ff4fd8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#090612,#23113d,#4b1f73,#7c3aed,#ff4fd8
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#d946ef&color_dots=#fdf2ff,#f5d0fe,#f0abfc,#e879f9,#d946ef

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
